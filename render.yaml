# Render Blueprint: https://render.com/docs/blueprint-spec
# One Docker web service (API + UI + Tesseract) and one PostgreSQL database, both on the free plan.
# Deploy: Render dashboard → New → Blueprint → connect this repository → Apply.

services:
  - type: web
    name: documind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      # Public-demo safeguards (see docs/DEPLOYMENT.md)
      - key: DEMO_MODE # private anonymous workspace per browser
        value: "true"
      - key: RETENTION_HOURS # uploads are deleted after a day
        value: "24"
      - key: UPLOAD_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: MAX_DOCUMENTS_PER_WORKSPACE
        value: "25"
      - key: MAX_UPLOAD_SIZE # 10 MB
        value: "10485760"
      - key: MAX_PAGES
        value: "10"
      # Free instances have 512 MB RAM and no persistent disk.
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: STORAGE_BACKEND # file bytes in PostgreSQL (the filesystem is wiped on restart)
        value: database
      - key: TRUST_PROXY_HEADERS # client IPs come from Render's proxy (X-Forwarded-For)
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: documind-db
    plan: free
    databaseName: documind
    user: documind
    ipAllowList: [] # reachable only from Render services
