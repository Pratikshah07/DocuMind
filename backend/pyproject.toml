[project]
name = "documind-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations embed long generated SQL literals (CHECK constraint bodies).
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations dir) shadows the package name.
known-third-party = ["alembic"]
